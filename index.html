<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Zetadu</title>
    <meta name="description" content="AI-powered learning, study, practice and trivia platform.">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/pwa-192x192.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />


    <script>
      try {
        const localTheme = localStorage.getItem('educore_theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (localTheme === 'dark' || (!localTheme && systemDark) || (localTheme === 'system' && systemDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  
    <script>
      const originalError = console.error;
      console.error = function(...args) {
        if (typeof args[0] === 'string' && args[0].includes('[vite]')) return;
        originalError.apply(console, args);
      };
    </script>

    <script>
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('[vite]')) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && e.reason.message.includes('[vite]')) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
    </script>

    <script type="module">
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>

    <link rel="manifest" href="/manifest.json" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
</head>

  <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
