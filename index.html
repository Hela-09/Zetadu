<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <title>Zetadu</title>
    <meta name="description" content="AI-powered learning, study, practice and trivia platform.">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />


    
  
    <script>
      const originalError = console.error;
      console.error = function(...args) {
        if (typeof args[0] === 'string' && args[0].includes('[vite]')) return;
        originalError.apply(console, args);
      };
    </script>

    <script>
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('[vite]')) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && e.reason.message.includes('[vite]')) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
    </script>

    <script type="module">
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>

    <link rel="manifest" href="/manifest.json" />
    <script>
      // Self-heal from dynamic chunk loading errors when new versions deploy
      window.addEventListener('vite:preloadError', function() {
        console.warn('[Zetadu PWA] Preload error detected. Reloading for latest version...');
        window.location.reload();
      });

      if ('serviceWorker' in navigator) {
        var isRefreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (isRefreshing) return;
          isRefreshing = true;
          window.location.reload();
        });

        window.addEventListener('load', function() {
          // updateViaCache: 'none' ensures the browser never caches sw.js
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then(function(registration) {
              // Proactively check for updates immediately
              registration.update();

              // When an update is detected and installed
              registration.addEventListener('updatefound', function() {
                var newWorker = registration.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed') {
                    if (navigator.serviceWorker.controller) {
                      // New version is ready - activate immediately
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  }
                });
              });

              // Proactively check for updates when returning to the PWA on Android / iPhone
              document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                  registration.update();
                }
              });

              // Check for updates when window gains focus or device reconnects online
              window.addEventListener('focus', function() {
                registration.update();
              });
              window.addEventListener('online', function() {
                registration.update();
              });

              // Periodic update check every 15 minutes
              setInterval(function() {
                registration.update();
              }, 15 * 60 * 1000);
            })
            .catch(function(err) {
              console.warn('[Zetadu PWA] Service worker registration failed:', err);
            });
        });
      }
    </script>
</head>

  <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
